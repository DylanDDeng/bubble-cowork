name: Aegis
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  AegisKit:
    path: AegisKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Aegis:
    type: application
    platform: iOS
    sources:
      - path: Aegis
      - path: Shared
    dependencies:
      - package: AegisKit
      - target: AegisNotifications
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Aegis
        INFOPLIST_FILE: Aegis/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Aegis/Aegis.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: $(AEGIS_BUNDLE_ID).dev
          AEGIS_APP_GROUP: group.$(AEGIS_BUNDLE_ID).dev
          AEGIS_APS_ENVIRONMENT: development
          AEGIS_DISPLAY_NAME: Aegis Dev
          AEGIS_URL_SCHEME: aegis-dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: $(AEGIS_BUNDLE_ID)
          AEGIS_APP_GROUP: group.$(AEGIS_BUNDLE_ID)
          AEGIS_APS_ENVIRONMENT: production
          AEGIS_DISPLAY_NAME: Aegis
          AEGIS_URL_SCHEME: aegis
  # Fills in a task's title on pushes from the app's local cache.
  AegisNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Shared
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Aegis Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_NAME: AegisNotifications
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: $(AEGIS_BUNDLE_ID).dev.notifications
          AEGIS_APP_GROUP: group.$(AEGIS_BUNDLE_ID).dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: $(AEGIS_BUNDLE_ID).notifications
          AEGIS_APP_GROUP: group.$(AEGIS_BUNDLE_ID)
schemes:
  Aegis:
    build:
      targets:
        Aegis: all
      preActions:
        - name: Bundle shared view logic
          settingsTarget: Aegis
          script: |
            export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
            cd "$PROJECT_DIR/../.." && node apps/ios/core/build.mjs
    run:
      config: Debug
    archive:
      config: Release
