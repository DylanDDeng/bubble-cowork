# DeepSeek Harness SDK runtime for Aegis: dsh-sdk-jsonrpc-server over stdio,
# driven per-thread by the Electron main process through
# @deepseek-ai/dsh-sdk-client. Composition merges the upstream
# examples/jsonrpc-agent runtime with the sandboxed bash/fs stack from
# examples/acp-agent. AEGIS_DSH_AGENT_PRESET selects one of the four official
# Web UI mode semantics at process spawn: standard, code (PTC), minimal, or
# cordis (Creator). stdout is reserved for JSON-RPC; no console logger.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

# The DeepSeek adapter. The model arrives per session over JSON-RPC
# (initialize), so it is not pinned here. The `models` list below is the
# catalog Aegis reads (deepseek-cli.ts getDeepseekModelConfig) — add models
# here, never in app code.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: !!js "process.env.DSH_REASONING_EFFORT ?? 'max'"
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

# Sandbox stack (acp-agent pattern): bash AND filesystem tools confined by the
# mode below. DSH_PERMISSION_MODE: workspace-write (default) or
# danger-full-access. DSH_CWD is the per-thread session workspace Aegis sets
# at spawn.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
    workspaceRoot: !!js "process.env.DSH_CWD ?? process.cwd()"

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

# The SDK wire has no approval channel (server->client requests are a dead
# capability upstream), so a widened-sandbox retry is auto-denied rather than
# asked: fails closed, the sandbox stays enforced.
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') !== 'minimal'"
    includeRuntimeContext: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') !== 'minimal'"
    persona: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'minimal' ? 'You are a helpful software engineer assistant.' : (process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'cordis' ? 'You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}. You can inspect and experiment with the live Cordis runtime to help create custom agent compositions. Verify your work and keep answers factual.' : 'You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug. Verify your work by running the code or tests. Keep answers brief and factual.'"
    tools:
      mode: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'code' ? 'code' : 'native'"
    workspaceContext: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'minimal' ? false : { maxBytes: 65536 }"
    skills:
      enabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') !== 'minimal'"
    toolBash: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'minimal' ? false : { enableRunInBackground: true }"
    toolJobs: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'minimal' ? false : {}"
    goals: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'minimal' ? false : {}"

# PTC / Code mode exposes the spine's registered tools through the generated
# TypeScript SDK and the single run_code transport. The runtime remains loaded
# in other modes so the composition shape is stable; native presentation never
# exposes it to the model.
- id: code-runtime
  name: '@deepseek-ai/dsh-code-runtime-worker-thread'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "process.env.DSH_SESSION_ROOT ?? './.sessions'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'minimal'"
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'minimal'"
  config:
    allowParallelInProgress: true

# Filesystem rides the SAME sandbox policy as bash (fs-sandbox replaces
# fs-local behind ctx.fs), so read stays available and write/edit are fenced
# by the effective mode.
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js "process.env.DSH_CWD ?? process.cwd()"

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'minimal'"

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'minimal'"
  config:
    sampleOverCapGlobResults: false

# Minimal mode deliberately exposes exactly two model-facing tools. The PTY
# service preserves shell state across turns; the editor still rides Aegis's
# sandboxed fs provider so Default / Full Access keeps its product meaning.
- id: minimal-terminal
  name: '@deepseek-ai/dsh-terminal'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') !== 'minimal'"

- id: minimal-terminal-bash
  name: '@deepseek-ai/dsh-terminal-bash'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') !== 'minimal'"
  config:
    timeoutMs: 300000

- id: minimal-persistent-bash
  name: '@deepseek-ai/dsh-tool-bash-persistent'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') !== 'minimal'"
  config:
    timeoutMs: 300000

- id: minimal-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') !== 'minimal'"
  config:
    maxOutputChars: 16000

# Standard and PTC match the official Web UI's search surface. Fetch remains
# disabled; search uses DeepSeek's server-side retrieval route and the same API
# credential as the primary model adapter.
- id: web
  name: '@deepseek-ai/dsh-web'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'minimal'"
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'minimal'"
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'minimal'"
  config:
    fetch: false
    searchTimeoutMs: 60000

# Creator mode is Standard plus the live Cordis inspection / experiment tool.
- id: cordis-host-runner
  name: '@deepseek-ai/dsh-cordis-host-runner'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') !== 'cordis'"

- id: tool-cordis
  name: '@deepseek-ai/dsh-tool-cordis'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') !== 'cordis'"

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: !!js "(process.env.AEGIS_DSH_AGENT_PRESET ?? 'standard') === 'minimal'"
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1
