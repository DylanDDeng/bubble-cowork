# DeepSeek Harness SDK runtime for Aegis: dsh-sdk-jsonrpc-server over stdio,
# driven per-thread by the Electron main process through
# @deepseek-ai/dsh-sdk-client. Composition merges the upstream
# examples/jsonrpc-agent runtime with the sandboxed bash/fs stack from
# examples/acp-agent. stdout is reserved for JSON-RPC; no console logger.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

# The DeepSeek adapter. The model arrives per session over JSON-RPC
# (initialize), so it is not pinned here. The `models` list below is the
# catalog Aegis reads (deepseek-cli.ts getDeepseekModelConfig) — add models
# here, never in app code.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

# Sandbox stack (acp-agent pattern): bash AND filesystem tools confined by the
# mode below. DSH_PERMISSION_MODE: workspace-write (default) or
# danger-full-access. DSH_CWD is the per-thread session workspace Aegis sets
# at spawn.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
    workspaceRoot: !!js "process.env.DSH_CWD ?? process.cwd()"

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

# The SDK wire has no approval channel (server->client requests are a dead
# capability upstream), so a widened-sandbox retry is auto-denied rather than
# asked: fails closed, the sandbox stays enforced.
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "process.env.DSH_SESSION_ROOT ?? './.sessions'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Filesystem rides the SAME sandbox policy as bash (fs-sandbox replaces
# fs-local behind ctx.fs), so read stays available and write/edit are fenced
# by the effective mode.
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js "process.env.DSH_CWD ?? process.cwd()"

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1
